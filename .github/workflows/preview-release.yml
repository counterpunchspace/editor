name: Preview Release

on:
    workflow_dispatch:

concurrency:
    group: preview-release
    cancel-in-progress: false

permissions:
    actions: read
    contents: write
    deployments: write

jobs:
    preview-release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Wait for green CI
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/wait-for-green-ci.sh

            - name: Resolve preview version
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/resolve-preview-release.sh

            - name: Inject preview versions
              run: |
                  TAG="${{ steps.version.outputs.TAG }}"
                  sed -i.bak "s/const VERSION = '[^']*'/const VERSION = '${TAG}'/" webapp/coi-serviceworker.js
                  sed -i.bak "s/const DISPLAY_VERSION = '[^']*'/const DISPLAY_VERSION = '${TAG}'/" webapp/coi-serviceworker.js
                  rm webapp/coi-serviceworker.js.bak

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install webapp dependencies
              run: npm install --prefix webapp

            - name: Build webapp with webpack
              run: npm run build --prefix webapp
              env:
                  EDITOR_VERSION: ${{ steps.version.outputs.TAG }}
                  BUILD_HASH_FULL: ${{ steps.version.outputs.COMMIT_SHA }}
                  BUILD_HASH_SHORT: ${{ steps.version.outputs.COMMIT_SHORT }}

            - name: Publish GitHub prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ steps.version.outputs.TAG }}" \
                      --target "${{ steps.version.outputs.COMMIT_SHA }}" \
                      --title "${{ steps.version.outputs.TAG }}" \
                      --notes-file release-notes.md \
                      --prerelease

            - name: Deploy preview to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: editorpreview
                  directory: ./webapp/build
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  branch: main

            - name: Deployment summary
              run: |
                  echo "✅ Preview ${{ steps.version.outputs.TAG }} deployed successfully!"
                  echo "📦 GitHub prerelease ${{ steps.version.outputs.TAG }}"
                  echo "🚀 Deployed to https://preview.editor.counterpunch.space"
