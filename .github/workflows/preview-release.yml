name: Preview Release

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: Stop after the preflight checks; deploy nothing to preview
                type: boolean
                default: false
            smoke_expect_editor:
                description: Wrong editor commit for the post-deploy wait, to rehearse the rollback
                type: string
                default: ""

concurrency:
    group: preview-release
    cancel-in-progress: false

permissions:
    actions: read
    contents: write
    deployments: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            TAG: ${{ steps.version.outputs.TAG }}
            COMMIT_SHA: ${{ steps.version.outputs.COMMIT_SHA }}
            COMMIT_SHORT: ${{ steps.version.outputs.COMMIT_SHORT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Wait for green CI
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/wait-for-green-ci.sh

            - name: Resolve preview version
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/resolve-preview-release.sh

            - name: Upload release notes
              uses: actions/upload-artifact@v4
              with:
                  name: preview-release-notes
                  path: release-notes.md
                  overwrite: true

    cutover:
        needs: prepare
        uses: ./.github/workflows/composed-cutover.yml
        with:
            target: preview
            editor_sha: ${{ needs.prepare.outputs.COMMIT_SHA }}
            website_ref: ${{ vars.WEBSITE_SHA != '' && vars.WEBSITE_SHA || 'main' }}
            collab_ref: ${{ vars.COLLAB_SHA != '' && vars.COLLAB_SHA || 'main' }}
            release_tag: ${{ needs.prepare.outputs.TAG }}
            editor_version: ${{ needs.prepare.outputs.TAG }}
            dry_run: ${{ inputs.dry_run }}
            smoke_expect_editor: ${{ inputs.smoke_expect_editor }}
        secrets: inherit

    github-prerelease:
        needs: [prepare, cutover]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                  name: preview-release-notes

            - name: Download trio.json
              uses: actions/download-artifact@v4
              with:
                  name: trio-preview

            - name: Publish GitHub prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.prepare.outputs.TAG }}
              run: |
                  NOTES=$(mktemp)
                  cat release-notes.md > "$NOTES"
                  if [ -f trio.json ]; then
                    printf '\n\n## Deployed trio\n\n```json\n' >> "$NOTES"
                    cat trio.json >> "$NOTES"
                    printf '\n```\n' >> "$NOTES"
                  fi
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" --prerelease
                    gh release upload "$TAG" trio.json --clobber
                  else
                    gh release create "$TAG" \
                        --target "${{ needs.prepare.outputs.COMMIT_SHA }}" \
                        --title "$TAG" \
                        --notes-file "$NOTES" \
                        --prerelease \
                        trio.json
                  fi

            - name: Deployment summary
              run: |
                  echo "Preview ${{ needs.prepare.outputs.TAG }} cut over."
                  echo "https://preview.editor.counterpunch.space"
                  echo "https://preview.counterpunch.space"
                  echo "https://preview.rooms.counterpunch.space"
