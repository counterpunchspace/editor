name: Preview Release

on:
    workflow_dispatch:

concurrency:
    group: preview-release
    cancel-in-progress: false

permissions:
    actions: read
    contents: write
    deployments: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            TAG: ${{ steps.version.outputs.TAG }}
            COMMIT_SHA: ${{ steps.version.outputs.COMMIT_SHA }}
            COMMIT_SHORT: ${{ steps.version.outputs.COMMIT_SHORT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Wait for green CI
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/wait-for-green-ci.sh

            - name: Resolve preview version
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/resolve-preview-release.sh

            - name: Upload release notes
              uses: actions/upload-artifact@v4
              with:
                  name: preview-release-notes
                  path: release-notes.md

    cutover:
        needs: prepare
        uses: ./.github/workflows/composed-cutover.yml
        with:
            target: preview
            editor_sha: ${{ needs.prepare.outputs.COMMIT_SHA }}
            website_ref: ${{ vars.WEBSITE_SHA != '' && vars.WEBSITE_SHA || 'main' }}
            collab_ref: ${{ vars.COLLAB_SHA != '' && vars.COLLAB_SHA || 'main' }}
            release_tag: ${{ needs.prepare.outputs.TAG }}
            editor_version: ${{ needs.prepare.outputs.TAG }}
        secrets: inherit

    github-prerelease:
        needs: [prepare, cutover]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ needs.prepare.outputs.COMMIT_SHA }}

            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                  name: preview-release-notes

            - name: Download trio.json
              uses: actions/download-artifact@v4
              with:
                  name: trio-preview

            - name: Publish GitHub prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  NOTES=$(mktemp)
                  cat release-notes.md > "$NOTES"
                  if [ -f trio.json ]; then
                    printf '\n\n## Deployed trio\n\n```json\n' >> "$NOTES"
                    cat trio.json >> "$NOTES"
                    printf '\n```\n' >> "$NOTES"
                  fi
                  gh release create "${{ needs.prepare.outputs.TAG }}" \
                      --target "${{ needs.prepare.outputs.COMMIT_SHA }}" \
                      --title "${{ needs.prepare.outputs.TAG }}" \
                      --notes-file "$NOTES" \
                      --prerelease \
                      trio.json

            - name: Deployment summary
              run: |
                  echo "Preview ${{ needs.prepare.outputs.TAG }} cut over."
                  echo "https://preview.editor.counterpunch.space"
                  echo "https://preview.counterpunch.space"
                  echo "https://preview.rooms.counterpunch.space"
