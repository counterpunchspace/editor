name: Release

on:
    push:
        tags:
            - "v*"

# Sets permissions
permissions:
    actions: read
    contents: write
    deployments: write

jobs:
    certify:
        if: ${{ !contains(github.ref, '-preview') && !contains(github.ref, '-pre.') }}
        runs-on: ubuntu-latest
        outputs:
            VERSION: ${{ steps.version.outputs.VERSION }}
            COMMIT_SHA: ${{ steps.commit.outputs.COMMIT_SHA }}
            COMMIT_SHORT: ${{ steps.commit.outputs.COMMIT_SHORT }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history to get the commit for the tag

            - name: Get commit SHA for tag
              id: commit
              run: |
                  COMMIT_SHA=$(git rev-list -n 1 ${{ github.ref }})
                  COMMIT_SHORT=$(git rev-parse --short "$COMMIT_SHA")
                  echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
                  echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT
                  echo "Commit SHA for tag: $COMMIT_SHA"

            - name: Extract version tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Extract release notes from CHANGELOG
              id: changelog
              run: |
                  # Extract content between second and third # headlines (skipping "# Unreleased")
                  awk '/^# / {if (++count == 3) exit} count == 2 && !/^# / {print}' CHANGELOG.md > release-notes.md

                  # Show extracted content
                  echo "Release notes:"
                  cat release-notes.md

                  # Set output for GitHub release
                  echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
                  cat release-notes.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            # Editor CI (checks, jest, chromium Playwright, Rust, Prettier and
            # the sharded cloud-collab e2e) already ran on this commit when main
            # was pushed. The release does not repeat any of it.
            - name: Wait for green CI
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/wait-for-green-ci.sh "" "${{ steps.commit.outputs.COMMIT_SHA }}" ci.yml

            - name: Upload release notes
              uses: actions/upload-artifact@v4
              with:
                  name: production-release-notes
                  path: release-notes.md

    cutover:
        needs: certify
        uses: ./.github/workflows/composed-cutover.yml
        with:
            target: production
            editor_sha: ${{ needs.certify.outputs.COMMIT_SHA }}
            website_ref: ${{ vars.WEBSITE_SHA != '' && vars.WEBSITE_SHA || 'main' }}
            collab_ref: ${{ vars.COLLAB_SHA != '' && vars.COLLAB_SHA || 'main' }}
            release_tag: ${{ needs.certify.outputs.VERSION }}
            editor_version: ${{ needs.certify.outputs.VERSION }}
        secrets: inherit

    github-release:
        needs: [certify, cutover]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ needs.certify.outputs.COMMIT_SHA }}

            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                  name: production-release-notes

            - name: Download trio.json
              uses: actions/download-artifact@v4
              with:
                  name: trio-production
                  path: .

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  NOTES=$(mktemp)
                  cat release-notes.md > "$NOTES"
                  if [ -f trio.json ]; then
                    printf '\n\n## Deployed trio\n\n```json\n' >> "$NOTES"
                    cat trio.json >> "$NOTES"
                    printf '\n```\n' >> "$NOTES"
                  fi
                  gh release create "${{ needs.certify.outputs.VERSION }}" \
                      --target "${{ needs.certify.outputs.COMMIT_SHA }}" \
                      --title "${{ needs.certify.outputs.VERSION }}" \
                      --notes-file "$NOTES" \
                      trio.json

            - name: Deployment summary
              run: |
                  echo "Production ${{ needs.certify.outputs.VERSION }} cut over."
                  echo "https://editor.counterpunch.space"
