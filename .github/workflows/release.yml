name: Release

# Started by release.sh after it pushed the version commit to main. The tag
# job of the cutover creates the vX.Y.Z tags only after the smoke test passed.
# With services=true (release.sh --services) it ships the website and collab
# commits of the newest preview and keeps the editor that production serves,
# tagged <editor version>+s.N. That release goes on the website repo, so
# editors see no update.
on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version, e.g. v0.1.0 (empty for a services release)
                required: false
                type: string
                default: ""
            services:
                description: Website and collab only; the production editor stays as it is
                type: boolean
                default: false
            dry_run:
                description: Stop after the preflight checks; deploy nothing to production
                type: boolean
                default: false

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    actions: read
    contents: write
    deployments: write

jobs:
    certify:
        runs-on: ubuntu-latest
        outputs:
            VERSION: ${{ inputs.services && steps.services.outputs.tag || steps.version.outputs.VERSION }}
            COMMIT_SHA: ${{ inputs.services && steps.services.outputs.editor_sha || steps.version.outputs.COMMIT_SHA }}
            EDITOR_VERSION: ${{ inputs.services && steps.services.outputs.editor_version || steps.version.outputs.VERSION }}
            PREVIEW_EDITOR_SHA: ${{ !inputs.services && steps.preview.outputs.preview_editor_sha || '' }}
            WEBSITE_SHA: ${{ steps.preview.outputs.website_sha }}
            COLLAB_SHA: ${{ steps.preview.outputs.collab_sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve services release
              id: services
              if: ${{ inputs.services }}
              run: |
                  set -euo pipefail
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                    echo "Run the release from main, not $GITHUB_REF"
                    exit 1
                  fi
                  if [ -n "${{ inputs.version }}" ]; then
                    echo "A services release takes no version; it keeps the production editor's."
                    exit 1
                  fi
                  node scripts/resolve-services-release.mjs production
                  printf 'Website and collab update. The editor is unchanged.\n' > release-notes.md

            - name: Validate version and release commit
              id: version
              if: ${{ !inputs.services }}
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                    echo "Run the release from main, not $GITHUB_REF"
                    exit 1
                  fi
                  if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Version must look like v1.2.3, got $VERSION"
                    exit 1
                  fi
                  COMMIT_SHA=$(git rev-parse HEAD)
                  existing=$(git ls-remote origin "refs/tags/${VERSION}" "refs/tags/${VERSION}^{}" | tail -1 | cut -f1)
                  if [ -n "$existing" ] && [ "$existing" != "$COMMIT_SHA" ]; then
                    echo "Tag $VERSION already exists on $existing, not $COMMIT_SHA"
                    exit 1
                  fi
                  if [ "${{ inputs.dry_run }}" != "true" ] && ! grep -qE "^# ${VERSION}( |$)" CHANGELOG.md; then
                    echo "CHANGELOG.md has no '# ${VERSION}' section. Run release.sh."
                    exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

            - name: Require a preview of this release
              id: preview
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WEBSITE_GH_TOKEN: ${{ secrets.CLOUD_E2E_PAT }}
                  WEBSITE_REPOSITORY: ${{ vars.WEBSITE_REPOSITORY || format('{0}/website', github.repository_owner) }}
              run: |
                  if [ "${{ inputs.services }}" = "true" ]; then
                    node scripts/check-preview-first.mjs --services
                  else
                    node scripts/check-preview-first.mjs "${{ steps.version.outputs.COMMIT_SHA }}"
                  fi

            - name: Extract release notes from CHANGELOG
              if: ${{ !inputs.services }}
              run: |
                  # Extract content between second and third # headlines (skipping "# Unreleased")
                  awk '/^# / {if (++count == 3) exit} count == 2 && !/^# / {print}' CHANGELOG.md > release-notes.md
                  echo "Release notes:"
                  cat release-notes.md

            # Editor CI already ran on this commit when main was pushed. The
            # release does not repeat any of it.
            - name: Wait for green CI
              if: ${{ !inputs.services }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/wait-for-green-ci.sh "" "${{ steps.version.outputs.COMMIT_SHA }}" ci.yml

            - name: Upload release notes
              uses: actions/upload-artifact@v4
              with:
                  name: production-release-notes
                  path: release-notes.md
                  overwrite: true

    cutover:
        needs: certify
        uses: ./.github/workflows/composed-cutover.yml
        with:
            target: production
            editor_sha: ${{ needs.certify.outputs.COMMIT_SHA }}
            website_ref: ${{ needs.certify.outputs.WEBSITE_SHA }}
            collab_ref: ${{ needs.certify.outputs.COLLAB_SHA }}
            release_tag: ${{ needs.certify.outputs.VERSION }}
            editor_version: ${{ needs.certify.outputs.EDITOR_VERSION }}
            attested_editor_sha: ${{ needs.certify.outputs.PREVIEW_EDITOR_SHA }}
            dry_run: ${{ inputs.dry_run }}
            services_only: ${{ inputs.services }}
        secrets: inherit

    github-release:
        needs: [certify, cutover]
        if: ${{ !inputs.dry_run }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ needs.certify.outputs.COMMIT_SHA }}

            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                  name: production-release-notes

            - name: Download trio.json
              uses: actions/download-artifact@v4
              with:
                  name: trio-production
                  path: .

            - name: Create GitHub Release
              if: ${{ !inputs.services }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.certify.outputs.VERSION }}
              run: |
                  NOTES=$(mktemp)
                  cat release-notes.md > "$NOTES"
                  if [ -f trio.json ]; then
                    printf '\n\n## Deployed trio\n\n```json\n' >> "$NOTES"
                    cat trio.json >> "$NOTES"
                    printf '\n```\n' >> "$NOTES"
                  fi
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    gh release edit "$VERSION" --title "$VERSION" --notes-file "$NOTES"
                    gh release upload "$VERSION" trio.json --clobber
                  else
                    gh release create "$VERSION" \
                        --target "${{ needs.certify.outputs.COMMIT_SHA }}" \
                        --title "$VERSION" \
                        --notes-file "$NOTES" \
                        trio.json
                  fi

            # Editors read the editor repo's releases to offer updates, so a
            # services release is published on the website repo instead.
            - name: Publish services release on the website repo
              if: ${{ inputs.services }}
              env:
                  GH_TOKEN: ${{ secrets.CLOUD_E2E_PAT }}
                  TAG: ${{ needs.certify.outputs.VERSION }}
                  REPO: ${{ vars.WEBSITE_REPOSITORY || format('{0}/website', github.repository_owner) }}
                  WEBSITE_SHA: ${{ needs.certify.outputs.WEBSITE_SHA }}
              run: bash scripts/publish-services-release.sh "$REPO" "$TAG" "$WEBSITE_SHA" release

            - name: Deployment summary
              run: |
                  echo "Production ${{ needs.certify.outputs.VERSION }} cut over."
                  echo "https://editor.counterpunch.space"
