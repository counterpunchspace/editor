name: Release

on:
    push:
        tags:
            - "v*"

# Sets permissions
permissions:
    contents: write
    deployments: write

jobs:
    release:
        if: ${{ !contains(github.ref, '-preview') && !contains(github.ref, '-pre.') }}
        runs-on: macos-latest
        needs: []
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history to get the commit for the tag

            - name: Get commit SHA for tag
              id: commit
              run: |
                  COMMIT_SHA=$(git rev-list -n 1 ${{ github.ref }})
                  COMMIT_SHORT=$(git rev-parse --short "$COMMIT_SHA")
                  echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
                  echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT
                  echo "Commit SHA for tag: $COMMIT_SHA"

            - name: Extract version tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Extract release notes from CHANGELOG
              id: changelog
              run: |
                  # Extract content between second and third # headlines (skipping "# Unreleased")
                  awk '/^# / {if (++count == 3) exit} count == 2 && !/^# / {print}' CHANGELOG.md > release-notes.md

                  # Show extracted content
                  echo "Release notes:"
                  cat release-notes.md

                  # Set output for GitHub release
                  echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
                  cat release-notes.md >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install graph tooling
              run: npm ci --ignore-scripts

            - name: Install LadybugDB native binding
              run: npm rebuild @ladybugdb/core --foreground-scripts

            - name: Install webapp dependencies
              run: npm install --prefix webapp

            - name: Install Playwright Chromium
              run: npx --prefix webapp playwright install chromium

            - name: Enforce graph chokepoints
              run: |
                  npx --no-install gitnexus analyze
                  npm run test:graph-chokepoints
                  npm run check:graph-chokepoints

            - name: Build webapp with webpack
              run: npm run build --prefix webapp
              env:
                  EDITOR_VERSION: ${{ steps.version.outputs.VERSION }}
                  BUILD_HASH_FULL: ${{ steps.commit.outputs.COMMIT_SHA }}
                  BUILD_HASH_SHORT: ${{ steps.commit.outputs.COMMIT_SHORT }}

            - name: Run full release test suite
              run: npm test --prefix webapp

            - name: Set up Rust nightly with the WASM target
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: wasm32-unknown-unknown

            - name: Set up wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0

            - name: Generate Rust WASM test fixture
              run: node webapp/compilation-test/compile-test.mjs webapp/examples/Fustat.glyphs

            - name: Run Rust WASM cache tests
              run: cd babelfont-fontc-build && rustup run nightly wasm-pack test --node

            - name: Check code formatting with Prettier
              run: cd webapp && npx prettier -c .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  body: ${{ steps.changelog.outputs.RELEASE_NOTES }}
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/pages-action@v1
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  projectName: editor
                  directory: ./webapp/build
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  branch: main

            - name: Deployment summary
              run: |
                  echo "✅ Release ${{ steps.version.outputs.VERSION }} deployed successfully!"
                  echo "📦 GitHub Release created"
                  echo "🚀 Deployed to Cloudflare Pages"
