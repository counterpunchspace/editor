name: CI

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

permissions:
    contents: read

jobs:
    # Graph chokepoints, type drift, protocol bindings, tsc, jest, and Prettier.
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install graph tooling
              run: npm ci --ignore-scripts

            - name: Install LadybugDB native binding
              run: npm rebuild @ladybugdb/core --foreground-scripts

            - name: Install dependencies in webapp
              run: npm install --prefix webapp

            # The protocol bindings check generates the expected files from collab.
            - name: Checkout collab for protocol bindings check
              uses: actions/checkout@v4
              with:
                  repository: ${{ vars.COLLAB_REPOSITORY || format('{0}/collab', github.repository_owner) }}
                  ref: ${{ vars.COLLAB_SHA != '' && vars.COLLAB_SHA || 'main' }}
                  path: _collab
                  token: ${{ secrets.CLOUD_E2E_PAT || github.token }}

            # Language-pack checks run pytest via python3 -m pytest. ubuntu-latest
            # does not ship pytest, and its Python is externally managed.
            - name: Install language-pack pytest
              run: sudo apt-get update && sudo apt-get install -y python3-pytest

            - name: Preflight bundled plugin wheels
              run: node plugin-contracts/generate.mjs && node plugin-contracts/preflight-bundled.mjs && node --test plugin-contracts/supervisor.test.mjs

            - name: Run static checks and jest
              run: npm run test:checks --prefix webapp
              env:
                  COLLAB_ROOT: ${{ github.workspace }}/_collab

            - name: Check code formatting with Prettier
              run: cd webapp && npx prettier -c .

    rust-wasm:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies in webapp
              run: npm install --prefix webapp

            - name: Set up Rust nightly with the WASM target
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: wasm32-unknown-unknown

            # jetli/wasm-pack-action renames from /tmp onto ~/.cargo, which is a
            # different filesystem on the Ubuntu 26 runners.
            - name: Install wasm-pack
              run: |
                  version=0.13.1
                  archive="wasm-pack-v${version}-x86_64-unknown-linux-musl"
                  curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${version}/${archive}.tar.gz" -o "/tmp/${archive}.tar.gz"
                  tar -xzf "/tmp/${archive}.tar.gz" -C /tmp
                  mkdir -p "$HOME/.cargo/bin"
                  cp "/tmp/${archive}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
                  "$HOME/.cargo/bin/wasm-pack" --version

            - name: Generate Rust WASM test fixture
              run: node webapp/compilation-test/compile-test.mjs webapp/examples/Fustat.glyphs

            - name: Run Rust WASM cache tests
              run: cd babelfont-fontc-build && rustup run nightly wasm-pack test --node

    # Chromium Playwright, split by measured duration rather than whole files.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies in webapp
              run: npm install --prefix webapp

            - name: Install Playwright Chromium
              run: npx --prefix webapp playwright install --with-deps chromium

            - name: Inject dynamic version for PWA cache busting
              id: version
              run: |
                  COMMIT_FULL="${GITHUB_SHA:-$(git rev-parse HEAD)}"
                  COMMIT_SHORT=$(git rev-parse --short "$COMMIT_FULL")
                  DATE=$(date -u +"%Y%m%d-%H%M")
                  NEW_VERSION="v0.0.0-preview-${DATE}-${COMMIT_SHORT}"
                  echo "Setting VERSION to: ${NEW_VERSION}"
                  sed -i.bak "s/const VERSION = '[^']*'/const VERSION = '${NEW_VERSION}'/" webapp/coi-serviceworker.js
                  sed -i.bak "s/const DISPLAY_VERSION = '[^']*'/const DISPLAY_VERSION = '${NEW_VERSION}'/" webapp/coi-serviceworker.js
                  rm webapp/coi-serviceworker.js.bak
                  echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
                  echo "commit_full=${COMMIT_FULL}" >> $GITHUB_OUTPUT
                  echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT

            - name: Build webapp with webpack
              run: npm run build --prefix webapp
              env:
                  EDITOR_VERSION: ${{ steps.version.outputs.version }}
                  BUILD_HASH_FULL: ${{ steps.version.outputs.commit_full }}
                  BUILD_HASH_SHORT: ${{ steps.version.outputs.commit_short }}

            - name: Run chromium Playwright shard
              working-directory: webapp
              env:
                  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/timings.json
              run: |
                  mkdir -p test-results
                  mapfile -t filters < <(node scripts/ci-shard.mjs --project chromium --shards 6 --index "${{ matrix.shard }}")
                  npx playwright test --project=chromium --reporter=list --reporter=json "${filters[@]}"

            - name: Upload Playwright timings
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-timings-chromium-${{ matrix.shard }}
                  path: webapp/test-results/timings.json
                  if-no-files-found: ignore

    # Deploys the trio to the staging hostnames, then the shard job runs the
    # suite there. previewrelease and release repeat that suite before cutover.
    cloud-collab-staging-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout editor
              uses: actions/checkout@v4

            - name: Checkout website
              uses: actions/checkout@v4
              with:
                  repository: ${{ vars.WEBSITE_REPOSITORY || format('{0}/website', github.repository_owner) }}
                  ref: ${{ vars.WEBSITE_SHA != '' && vars.WEBSITE_SHA || 'main' }}
                  path: _cloud_e2e/website
                  token: ${{ secrets.CLOUD_E2E_PAT || github.token }}

            - name: Checkout collab
              uses: actions/checkout@v4
              with:
                  repository: ${{ vars.COLLAB_REPOSITORY || format('{0}/collab', github.repository_owner) }}
                  ref: ${{ vars.COLLAB_SHA != '' && vars.COLLAB_SHA || 'main' }}
                  path: _cloud_e2e/collab
                  token: ${{ secrets.CLOUD_E2E_PAT || github.token }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install editor webapp dependencies
              run: npm install --prefix webapp

            - name: Build editor production bundle
              run: npm run build --prefix webapp

            - name: Install website dependencies
              run: npm ci
              working-directory: _cloud_e2e/website

            - name: Build website
              run: npm run build
              working-directory: _cloud_e2e/website

            - name: Resolve collab root
              id: collab
              run: |
                  if [ -f _cloud_e2e/collab/workers/room/wrangler.toml ]; then
                    echo "root=${GITHUB_WORKSPACE}/_cloud_e2e/collab" >> "$GITHUB_OUTPUT"
                  elif [ -f _cloud_e2e/collab/collab/workers/room/wrangler.toml ]; then
                    echo "root=${GITHUB_WORKSPACE}/_cloud_e2e/collab/collab" >> "$GITHUB_OUTPUT"
                  else
                    echo "Could not find collab workers/room/wrangler.toml"
                    find _cloud_e2e/collab -name wrangler.toml | head
                    exit 1
                  fi

            - name: Install collab dependencies
              run: npm ci
              working-directory: ${{ steps.collab.outputs.root }}

            - name: Deploy staging Workers and website
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  EDITOR_ROOT: ${{ github.workspace }}
                  WEBSITE_ROOT: ${{ github.workspace }}/_cloud_e2e/website
                  COLLAB_ROOT: ${{ steps.collab.outputs.root }}
                  COMMIT_SHA: ${{ github.sha }}
              run: bash scripts/deploy-cloud-staging.sh site

            - name: Real-email signup on staging
              working-directory: _cloud_e2e/website
              env:
                  SIGNUP_E2E_ORIGIN: https://staging.counterpunch.space
                  SIGNUP_E2E_D1_NAME: context_users_staging
                  SIGNUP_E2E_IMAP_USER: ${{ secrets.SIGNUP_E2E_IMAP_USER }}
                  SIGNUP_E2E_IMAP_PASS: ${{ secrets.SIGNUP_E2E_IMAP_PASS }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: node scripts/e2e-magic-link-signup.mjs

            - name: Deploy staging editor
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  EDITOR_ROOT: ${{ github.workspace }}
              run: bash scripts/deploy-cloud-staging.sh editor

            - name: Record tested SHAs
              run: |
                  mkdir -p attestation
                  jq -n \
                    --arg editor "$GITHUB_SHA" \
                    --arg website "$(git -C _cloud_e2e/website rev-parse HEAD)" \
                    --arg collab "$(git -C _cloud_e2e/collab rev-parse HEAD)" \
                    '{editor:$editor,website:$website,collab:$collab}' \
                    > attestation/cloud-e2e-trio.json
                  cat attestation/cloud-e2e-trio.json

            - name: Upload trio SHA file
              uses: actions/upload-artifact@v4
              with:
                  name: cloud-e2e-trio-shard
                  path: attestation/cloud-e2e-trio.json

    cloud-collab-e2e:
        needs: cloud-collab-staging-deploy
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                group:
                    - marketplace
                    - reliability
                    - seed-lifecycle
                    - quota-integrity
                    - three-window
        steps:
            - name: Checkout editor
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install editor webapp dependencies
              run: npm install --prefix webapp

            - name: Install Playwright Chromium
              run: npx --prefix webapp playwright install --with-deps chromium

            - name: Run cloud-collab Playwright on staging
              working-directory: webapp
              env:
                  CLOUD_COLLAB_E2E: "1"
                  CLOUD_COLLAB_REMOTE: "1"
                  CLOUD_E2E_EDITOR_URL: https://staging.editor.counterpunch.space
                  CLOUD_COLLAB_WEBSITE_URL: https://staging.counterpunch.space
                  CLOUD_COLLAB_ROOM_URL: https://staging.rooms.counterpunch.space
                  E2E_OPERATOR_TOKEN: ${{ secrets.E2E_OPERATOR_TOKEN }}
                  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/timings.json
              run: |
                  mkdir -p test-results
                  mapfile -t filters < <(node scripts/ci-shard.mjs --project cloud-collab --group "${{ matrix.group }}")
                  npx playwright test --project=cloud-collab --reporter=list --reporter=json "${filters[@]}"

            - name: Upload Playwright timings
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-timings-cloud-${{ matrix.group }}
                  path: webapp/test-results/timings.json
                  if-no-files-found: ignore

            - name: Upload Playwright failure evidence
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cloud-collab-e2e-${{ matrix.group }}
                  path: webapp/test-results
                  if-no-files-found: ignore

    cloud-collab-staging-leftovers:
        needs: cloud-collab-e2e
        if: always() && needs.cloud-collab-e2e.result != 'cancelled'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout editor
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Remove staging e2e data and fail if any was left
              env:
                  CLOUD_COLLAB_WEBSITE_URL: https://staging.counterpunch.space
                  E2E_OPERATOR_TOKEN: ${{ secrets.E2E_OPERATOR_TOKEN }}
              run: node scripts/staging-e2e-leftovers.mjs

    # Publishes the attestation only when every e2e shard passed and staging is clean.
    cloud-collab-e2e-result:
        needs: [cloud-collab-e2e, cloud-collab-staging-leftovers]
        runs-on: ubuntu-latest
        steps:
            - name: Download shard trio
              uses: actions/download-artifact@v4
              with:
                  name: cloud-e2e-trio-shard

            - name: Publish attestation
              uses: actions/upload-artifact@v4
              with:
                  name: cloud-e2e-trio
                  path: cloud-e2e-trio.json
